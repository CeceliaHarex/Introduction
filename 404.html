<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excellence Without End — 页面不存在</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3efe6">
  <!--
    404 页面可能出现在任意路径下，浏览器会按当前地址解析相对路径。
    这里把基址固定到站点根目录，样式和链接才不会走丢。
    如果你把仓库改名了，把下面的 repo 改成新仓库名即可。
  -->
  <script>
    (function () {
      var repo = "CeceliaHarex.github.io";
      var first = location.pathname.split("/").filter(Boolean)[0] || "";
      var base = first === repo ? "/" + repo + "/" : "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preload" href="assets/fonts/CascadiaCode.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var forced = new URLSearchParams(location.search).get("theme");
        var saved = localStorage.getItem("pf:theme");
        var theme = forced === "light" || forced === "dark"
          ? forced
          : saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body data-title="页面不存在" id="top">
  <header class="site-header" id="siteHeader">
    <div class="shell header-inner header-inner--simple">
      <a class="brand" href="index.html" aria-label="回到首页">
        <img class="brand-avatar" src="assets/img/avatar-128.jpg" alt="" width="40" height="40">
        <span class="brand-name" data-bind="identity.fullName">Cecelia Harex</span>
      </a>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深浅色主题">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
          </svg>
        </button>
        <a class="btn btn-ghost btn-sm" href="index.html">回到首页</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="error-page">
      <div class="shell">
        <p class="section-kicker"><span>404</span> Not found</p>
        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-title">这个页面走丢了。</h1>
        <p class="error-text">可能是链接写错了，也可能它被移动或删掉了。回首页看看作品，或者去文章页随便翻一篇。</p>
        <div class="btn-row">
          <a class="btn btn-solid" href="index.html">回到首页</a>
          <a class="btn btn-ghost" href="blog.html">看看文章</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="studio-footer">
    <div class="shell">
      <span class="mono">Cecelia Harex · Portfolio</span>
      <a class="mono" href="index.html">index.html</a>
    </div>
  </footer>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/site.js" defer></script>
</body>
</html>
